# Baut die Web-Version (PWA) und veröffentlicht sie auf GitHub Pages.
# Einmalig im Repository einrichten:
#   1. Settings → Pages → Source: "GitHub Actions"
#   2. Settings → Secrets and variables → Actions: SUPABASE_URL und SUPABASE_PUBLIC_KEY, als Variables
#      oder Secrets (beides geht; die Werte sind ohnehin in der fertigen Web-App sichtbar).
#      Nur den öffentlichen Schlüssel verwenden, niemals einen sb_secret_-Schlüssel.
name: Web-Version

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Logik-Tests
        run: ./gradlew :shared:desktopTest

      - name: Web-Version bauen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_PUBLIC_KEY: ${{ secrets.SUPABASE_PUBLIC_KEY || vars.SUPABASE_PUBLIC_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLIC_KEY" ]; then
            echo "::warning::SUPABASE_URL oder SUPABASE_PUBLIC_KEY fehlt: die Web-Version zeigt dann 'App nicht eingerichtet'."
          fi
          ./gradlew :composeApp:wasmJsBrowserDistribution

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: composeApp/build/dist/wasmJs/productionExecutable

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
